openapi: 3.0.3
info:
  title: SCIPOS - Servicio de Productos
  description: >
    Catálogo de productos y servicios, inventario y compras a proveedor
    (RF-07, RF-08, RF-09, RF-34, RF-35, RF-36). La identidad del usuario viaja
    en el header x-usuario-id; los endpoints protegidos verifican privilegios
    contra el servicio de seguridad.
  version: "1.0"
servers:
  - url: http://localhost:4000/api/productos
    description: A través del gateway
  - url: http://localhost:4002
    description: Directo al servicio

tags:
  - name: productos
  - name: compras
  - name: health

paths:
  /health:
    get:
      tags: [health]
      summary: Health check del servicio
      responses:
        "200":
          description: Servicio disponible

  /productos/resumen:
    get:
      tags: [productos]
      summary: Resumen de productos para el dashboard
      description: Requiere identidad (header x-usuario-id).
      security:
        - identidadUsuario: []
      responses:
        "200":
          description: Conteos resumidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenProductos"
        "401":
          $ref: "#/components/responses/SinIdentidad"

  /productos:
    get:
      tags: [productos]
      summary: Listar productos y servicios, con filtros opcionales
      description: "Privilegio requerido: productos:ver"
      security:
        - identidadUsuario: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVO, INACTIVO]
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [PRODUCTO, SERVICIO]
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"
    post:
      tags: [productos]
      summary: Registrar un producto o servicio
      description: "Privilegio requerido: productos:crear"
      security:
        - identidadUsuario: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearProducto"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"

  /productos/{id}:
    get:
      tags: [productos]
      summary: Obtener un producto por id
      description: "Privilegio requerido: productos:ver"
      security:
        - identidadUsuario: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [productos]
      summary: Actualizar los datos de un producto
      description: "Privilegio requerido: productos:editar"
      security:
        - identidadUsuario: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarProducto"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    delete:
      tags: [productos]
      summary: Eliminar definitivamente un producto
      description: >
        Privilegio requerido: productos:eliminar. Falla con 409 si el producto
        tiene compras registradas (úsese la baja lógica en su lugar).
      security:
        - identidadUsuario: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      responses:
        "200":
          description: Producto eliminado
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El producto tiene compras registradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"

  /productos/{id}/estado:
    patch:
      tags: [productos]
      summary: Activar o desactivar un producto (baja lógica)
      description: "Privilegio requerido: productos:desactivar"
      security:
        - identidadUsuario: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo:
                  type: boolean
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /productos/{id}/stock:
    post:
      tags: [productos]
      summary: Ajustar existencias de un producto
      description: >
        Endpoint de uso interno entre servicios: lo consume ventas-caja para
        descontar stock al vender (delta negativo, motivo VENTA) y reponerlo
        al cancelar (delta positivo). Solo requiere identidad: el privilegio
        de la acción original ya se validó en el servicio que llama.
      security:
        - identidadUsuario: []
      parameters:
        - $ref: "#/components/parameters/ProductoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjustarStock"
      responses:
        "201":
          description: Stock ajustado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          description: El ajuste dejaría existencia negativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /compras:
    post:
      tags: [compras]
      summary: Registrar una compra a proveedor e incrementar existencias
      description: >
        Privilegio requerido: compras:ver. Incrementa las existencias de
        todas las partidas en una sola transacción (RF-34, RF-35, RF-36).
      security:
        - identidadUsuario: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearCompra"
      responses:
        "201":
          description: Compra registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compra"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "401":
          $ref: "#/components/responses/SinIdentidad"
        "403":
          $ref: "#/components/responses/SinPrivilegio"
        "404":
          description: Algún producto de las partidas no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEstandar"

components:
  securitySchemes:
    identidadUsuario:
      type: apiKey
      in: header
      name: x-usuario-id
      description: Identificador del usuario activo (por ejemplo usuario-administrador).

  parameters:
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: p-001

  responses:
    SinIdentidad:
      description: La petición no trae el header x-usuario-id, o el usuario no existe o está inactivo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
    SinPrivilegio:
      description: El usuario no cuenta con el privilegio requerido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
    NoEncontrado:
      description: El recurso indicado no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"
    ErrorValidacion:
      description: El cuerpo de la petición no pasa las validaciones
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEstandar"

  schemas:
    Producto:
      type: object
      properties:
        id:
          type: string
          example: p-001
        lote:
          type: string
          example: ABA-001
        nombre:
          type: string
          example: Abarrote surtido 1kg
        tipo:
          type: string
          enum: [PRODUCTO, SERVICIO]
        precioCompra:
          type: number
          example: 29.5
        precioVenta:
          type: number
          example: 45.5
        existencia:
          type: integer
          example: 120
        fechaCaducidad:
          type: string
          format: date-time
          nullable: true
        activo:
          type: boolean

    CrearProducto:
      type: object
      required: [lote, nombre, tipo, precioCompra, precioVenta]
      properties:
        lote:
          type: string
          example: ABA-001
        nombre:
          type: string
          example: Abarrote surtido 1kg
        tipo:
          type: string
          enum: [PRODUCTO, SERVICIO]
        precioCompra:
          type: number
          example: 29.5
        precioVenta:
          type: number
          example: 45.5
        existencia:
          type: integer
          default: 0
          example: 120
        fechaCaducidad:
          type: string
          format: date
          example: "2026-11-30"

    ActualizarProducto:
      type: object
      properties:
        lote:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          enum: [PRODUCTO, SERVICIO]
        precioCompra:
          type: number
        precioVenta:
          type: number
        existencia:
          type: integer
        fechaCaducidad:
          type: string
          format: date

    AjustarStock:
      type: object
      required: [delta, motivo]
      properties:
        delta:
          type: integer
          example: -1
          description: Positivo para incrementar, negativo para decrementar.
        motivo:
          type: string
          enum: [VENTA, COMPRA, AJUSTE]

    ResumenProductos:
      type: object
      properties:
        productosActivos:
          type: integer
          example: 42
        stockBajo:
          type: integer
          example: 3
        proximosACaducar:
          type: integer
          example: 5

    PartidaCompra:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId:
          type: string
          example: p-001
        cantidad:
          type: integer
          example: 50
        precioCompra:
          type: number
          description: Si se omite, usa el precioCompra vigente del producto.
          example: 29.5

    CrearCompra:
      type: object
      required: [partidas]
      properties:
        proveedor:
          type: string
          example: Proveedor Central S.A.
        partidas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PartidaCompra"

    Compra:
      type: object
      properties:
        id:
          type: string
        proveedor:
          type: string
          nullable: true
        fecha:
          type: string
          format: date-time
        total:
          type: number
          example: 1475.0
        partidas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              productoId:
                type: string
              cantidad:
                type: integer
              precioCompra:
                type: number

    ErrorEstandar:
      type: object
      properties:
        estatus:
          type: integer
          example: 403
        mensaje:
          type: string
          example: No cuentas con el privilegio "productos:crear".
        error:
          type: string
          example: Forbidden
        ruta:
          type: string
          example: /productos
        fecha:
          type: string
          format: date-time
