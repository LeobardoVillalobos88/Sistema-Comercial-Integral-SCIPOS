# Punto de entrada único del despliegue.
#
# El navegador solo habla con nginx: la interfaz y la API quedan bajo el mismo
# origen, así que no se emiten peticiones de origen cruzado y no hay lista de
# orígenes que mantener al cambiar de dominio o de IP.
#
# Los servicios 4001-4006, Postgres y Redis no publican puerto al host: viven
# en la red interna de Docker y solo se alcanzan entre contenedores.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1024;

  # Margen para los comprobantes en PDF y las respuestas de reportes.
  client_max_body_size 10m;

  upstream interfaz {
    server web-shell:3001;
  }

  upstream api {
    server gateway:4000;
  }

  server {
    listen 80;
    server_name _;

    # El prefijo /api se conserva tal cual porque el gateway enruta sobre él
    # hacia cada microservicio.
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Los reportes agregan datos de varios servicios y pueden tardar.
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://interfaz;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
    }
  }
}
