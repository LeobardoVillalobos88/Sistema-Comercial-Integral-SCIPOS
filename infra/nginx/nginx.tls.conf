# Variante con TLS del punto de entrada.
#
# Es el mismo archivo que nginx.conf con tres diferencias: escucha en 443 con
# certificado, deja el 80 para redirigir, y reserva una ruta sin redirección
# para que Let's Encrypt pueda renovar el certificado.
#
# No se usa hasta que existan el dominio y el certificado. Se activa con el
# archivo de superposición:
#
#   docker compose -f infra/docker/compose/docker-compose.prod.yml \
#                  -f infra/docker/compose/docker-compose.tls.yml \
#                  --env-file .env up -d
#
# Antes de activarlo hay que emitir el certificado. El procedimiento completo
# está en docs/DESPLIEGUE-AWS.md, apartado "Servir por HTTPS".

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1024;

  client_max_body_size 10m;

  upstream interfaz {
    server web-shell:3001;
  }

  upstream api {
    server gateway:4000;
  }

  # --- Puerto 80: solo para el desafío de Let's Encrypt y para redirigir -----
  server {
    listen 80;
    server_name ${DOMINIO} www.${DOMINIO};

    # Esta ruta NO se redirige. Let's Encrypt valida por HTTP simple, así que
    # una redirección a HTTPS antes de tener certificado deja la renovación
    # dando vueltas contra un certificado que todavía no existe.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- Puerto 443: el sitio ------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMINIO} www.${DOMINIO};

    ssl_certificate     /etc/letsencrypt/live/${DOMINIO}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMINIO}/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Pide al navegador que no vuelva a intentar por HTTP durante un año.
    # Se deja en un año porque el certificado se renueva solo; si la
    # renovación se abandonara, el sitio quedaría inalcanzable hasta que
    # venza la cabecera, y por eso conviene no activarla antes de comprobar
    # que la renovación automática funciona.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      # El gateway lee este encabezado para saber que la petición original
      # venía cifrada. Sin él daría por hecho HTTP.
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://interfaz;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
    }
  }
}
